    <!-- Load the non-critical chat widget after the showroom is interactive. -->
    <script>
        window.addEventListener('load', function () {
            var loadChat = function () {
                var injectScript = document.createElement('script');
                injectScript.src = 'https://cdn.botpress.cloud/webchat/v2.1/inject.js';
                injectScript.onload = function () {
                    var configScript = document.createElement('script');
                    configScript.src = 'https://files.bpcontent.cloud/2026/08/29/10/20260829103029-LQNVGGCK.js';
                    configScript.defer = true;
                    document.head.appendChild(configScript);
                };
                document.head.appendChild(injectScript);
            };

            window.setTimeout(loadChat, 8000);
        });
    </script>
</head>
<body style="background-color: #0b0f19; color: #fff; margin: 0; font-family: inherit;">

        <!-- Restores the real path after 404.html's redirect (see public/404.html) -->
        <script>
            (function () {
                var redirect = sessionStorage.redirect;
                delete sessionStorage.redirect;
                if (redirect && redirect !== location.href) {
                    history.replaceState(null, '', redirect.replace(location.origin, ''));
                }
            })();
        </script>

    <!-- React Root Mount Point -->
    <div id="root"></div>

    <!-- Vite Entry Point Script -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Bootstrap Bundle JS (Popper included) - required for navbar toggler, dropdowns, and modals -->

</body>
